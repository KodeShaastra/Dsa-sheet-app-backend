# Nginx on the EC2 server: /api/* → Express (4000), everything else → Next.js (3000).
# CloudFront sits in front and handles HTTPS. Port 80 must only be open to CloudFront (see DEPLOY.md).
# Installed by setup-server.sh as /etc/nginx/sites-available/dsa-sheet.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Express accepts JSON bodies up to 100kb; leave a little room.
    client_max_body_size 1m;

    # Same headers for both apps. $proxy_add_x_forwarded_for = "visitor, cloudfront" (TRUST_PROXY_HOPS=2).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
